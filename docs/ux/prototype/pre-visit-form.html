<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-visit form</title>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components/bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#006B44}a:hover{color:#008A5C}
</style>
</head>
<body>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface-page); font-family: var(--font-text); color: var(--text-body); display: flex; flex-direction: column; padding: 20px 24px 24px; gap: 18px; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <span style="font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--text-strong); letter-spacing: -0.01em">[Clinic name]</span>
    <span style="font-size: 13px; color: var(--text-muted)">Tue 12 Nov · 10:15</span>
  </header>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong)">Before your visit</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-body)">About 3 minutes. You can change your answers until you are called in.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="reason" style="font-size: 14px; font-weight: 600; color: var(--text-strong)">Reason for your visit</label>
    <textarea id="reason" rows="2" maxlength="200" style="box-sizing: border-box; border: 1px solid var(--border-strong); border-radius: 8px; padding: 10px 12px; font-family: var(--font-text); font-size: 15px; line-height: 1.45; color: var(--text-strong); background: var(--surface-card); resize: none">Knee pain since last week, follow-up</textarea>
    <span style="align-self: flex-end; font-family: var(--font-mono); font-size: 12px; color: var(--text-muted)">36 / 200</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="meds" style="font-size: 14px; font-weight: 600; color: var(--text-strong)">Medicines you take now</label>
    <input id="meds" type="text" placeholder="None, or list them" value="Ibuprofen 400 mg when needed" style="height: 46px; box-sizing: border-box; border: 1px solid var(--border-strong); border-radius: 8px; padding: 0 12px; font-family: var(--font-text); font-size: 15px; color: var(--text-strong); background: var(--surface-card)">
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="fund" style="font-size: 14px; font-weight: 600; color: var(--text-strong)">Health insurance fund</label>
      <select id="fund" style="height: 46px; box-sizing: border-box; border: 1px solid var(--border-strong); border-radius: 8px; padding: 0 10px; font-family: var(--font-text); font-size: 15px; color: var(--text-strong); background: var(--surface-card)">
        <option>[Fund name]</option>
      </select>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="member" style="font-size: 14px; font-weight: 600; color: var(--text-strong)">Member number</label>
      <input id="member" type="text" inputmode="numeric" style="height: 46px; box-sizing: border-box; border: 1px solid var(--border-strong); border-radius: 8px; padding: 0 12px; font-family: var(--font-mono); font-size: 15px; color: var(--text-strong); background: var(--surface-card)">
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="tel" style="font-size: 14px; font-weight: 600; color: var(--text-strong)">Phone number</label>
    <input id="tel" type="tel" value="+32 470 12 34 56" style="height: 46px; box-sizing: border-box; border: 1px solid var(--border-strong); border-radius: 8px; padding: 0 12px; font-family: var(--font-mono); font-size: 15px; color: var(--text-strong); background: var(--surface-card)">
  </div>

  <div style="display: flex; gap: 12px; align-items: flex-start; background: var(--surface-subtle); border-radius: 14px; padding: 14px">
    <input id="consent" type="checkbox" checked style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #006B44; flex-shrink: 0">
    <label for="consent" style="font-size: 13px; line-height: 1.5; color: var(--text-body)">Only Dr. Peeters and reception see these answers. They are never sent by text and are deleted after your visit's retention period. <a href="#" style="font-weight: 600">How we use your data</a></label>
  </div>

  <button type="button" style="height: 54px; margin-top: auto; border: 0; border-radius: 8px; background: var(--surface-accent-deep); color: var(--text-on-accent); font-family: var(--font-text); font-size: 17px; font-weight: 600; cursor: pointer">Save answers</button>
</main>
</body>
</html>
