<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visit page, being called</title>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components/bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E6F4EE}
</style>
</head>
<body>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface-inverse); font-family: var(--font-text); color: var(--text-on-dark); display: flex; flex-direction: column; padding: 20px 24px 32px; gap: 24px; overflow: hidden">
  <header style="display: flex; align-items: center; height: 44px">
    <span style="font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--text-on-dark); letter-spacing: -0.01em">[Clinic name]</span>
  </header>

  <div style="display: flex; flex-direction: column; gap: 24px; margin-top: 64px">
    <span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 999px; background: var(--ethix-emerald); display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></span>
    <h1 style="margin: 0; font-family: var(--font-display); font-size: 44px; line-height: 1.06; font-weight: 700; letter-spacing: -0.03em; color: var(--text-on-dark)">You're being called, Sara</h1>
    <p style="margin: 0; font-size: 18px; line-height: 1.5; color: var(--text-on-dark-muted)">Dr. Peeters is ready for you. Please go to the consultation room now.</p>
  </div>

  <section aria-label="Where to go" style="background: rgba(255,255,255,.06); border: 1px solid var(--border-on-dark); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-on-dark-muted)">Go to</span>
    <span style="font-family: var(--font-display); font-size: 52px; line-height: 1.04; font-weight: 700; letter-spacing: -0.03em; color: var(--text-on-dark)">Room 3</span>
    <span style="font-size: 14px; color: var(--text-on-dark-muted)">Called at 10:44</span>
  </section>

  <p style="margin: 0; margin-top: auto; font-size: 14px; line-height: 1.55; color: var(--text-on-dark-muted)">Can't come right away? Tell reception so the doctor can see the next patient.</p>
</main>
</body>
</html>
