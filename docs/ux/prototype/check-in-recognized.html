<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR check-in, recognized phone</title>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components/bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#006B44}a:hover{color:#008A5C}
</style>
</head>
<body>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface-page); font-family: var(--font-text); color: var(--text-body); display: flex; flex-direction: column; padding: 20px 24px 32px; gap: 24px; overflow: hidden">
  <header style="display: flex; align-items: center; height: 44px">
    <span style="font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--text-strong); letter-spacing: -0.01em">[Clinic name]</span>
  </header>

  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 40px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted)">Check-in</span>
    <h1 style="margin: 0; font-family: var(--font-display); font-size: 40px; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong)">Hi Sara, tap to confirm you're here</h1>
  </div>

  <section aria-label="Your appointment" style="background: var(--surface-card-tint); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-strong)">Today, 10:15</span>
    <span style="font-size: 15px; color: var(--text-body)">Dr. Peeters</span>
  </section>

  <button type="button" style="height: 56px; border: 0; border-radius: 8px; background: var(--surface-accent-deep); color: var(--text-on-accent); font-family: var(--font-text); font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
    I'm here
  </button>

  <a href="check-in-text-code.html" style="align-self: center; min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: var(--text-accent-deep); border-bottom: 0">Not Sara? Check in with your phone number</a>

  <p style="margin: 0; margin-top: auto; font-size: 14px; line-height: 1.55; color: var(--text-muted)">After check-in, take a seat. Your page will show when you can expect to be called.</p>
</main>
</body>
</html>
